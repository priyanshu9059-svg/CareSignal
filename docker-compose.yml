services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caresignal
      POSTGRES_USER: caresignal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U caresignal -d caresignal"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://caresignal:${POSTGRES_PASSWORD}@postgres:5432/caresignal
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_MODE: ${AI_MODE:-demo}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
  frontend:
    build:
      context: frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - 127.0.0.1:3000:3000
volumes:
  postgres_data:
