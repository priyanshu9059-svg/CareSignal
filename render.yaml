services:
  - type: web
    name: caresignal-sih-26094
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caresignal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODE
        value: demo
      - key: DEMO_ENABLED
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: caresignal-db
    plan: free
    region: singapore
    databaseName: caresignal
    user: caresignal
