services:
  - type: web
    name: caresignal-sih-26094
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: caresignal-storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caresignal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODE
        value: demo
      - key: DEMO_ENABLED
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: STORAGE_PATH
        value: /app/storage
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Custom domains: set APP_ORIGIN to the exact https origin (and optional APP_ORIGINS CSV).
      # RENDER_EXTERNAL_HOSTNAME / RENDER_EXTERNAL_URL are auto-injected by Render.

databases:
  - name: caresignal-db
    plan: free
    region: singapore
    databaseName: caresignal
    user: caresignal
